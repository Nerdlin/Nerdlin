<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Illia Kovalenko — Marketing x Data x Automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.6" stop-color="#150f2e"/>
      <stop offset="1" stop-color="#2a1769"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A177F7"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.4s cubic-bezier(.2,.8,.2,1) forwards}
      .b1{animation-delay:.6s}.b2{animation-delay:1.0s}.b3{animation-delay:1.4s}
      .row{opacity:0;animation:fade .5s ease forwards}
      .r0{animation-delay:.2s}.r1{animation-delay:.6s}.r2{animation-delay:1.0s}.r3{animation-delay:1.4s}.r4{animation-delay:2.0s}
      .cursor{animation:blink 1s steps(1) infinite}
      .pulse{animation:pulse 2s ease-in-out infinite}
      .float{animation:float 5s ease-in-out infinite}
      @keyframes grow{to{transform:scaleX(1)}}
      @keyframes fade{to{opacity:1}}
      @keyframes blink{50%{opacity:0}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    </style>
  </defs>

  <rect width="900" height="320" rx="14" fill="url(#bg)"/>
  <rect width="900" height="320" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="899" height="319" rx="14" fill="none" stroke="#A177F7" stroke-opacity="0.25"/>

  <!-- left: identity -->
  <g class="sans">
    <text x="44" y="82" class="mono" font-size="13" fill="#A177F7" letter-spacing="3">MARKETING  x  DATA  x  AUTOMATION</text>
    <text x="44" y="136" font-size="48" font-weight="800" fill="#e6edf3">Illia</text>
    <text x="44" y="186" font-size="48" font-weight="800" fill="url(#accent)">Kovalenko</text>
    <rect x="44" y="204" width="64" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="44" y="236" font-size="16" fill="#9da7b3">I measure what marketing does,</text>
    <text x="44" y="258" font-size="16" fill="#9da7b3">then automate it with code.</text>
    <text x="44" y="290" class="mono" font-size="12" fill="#6e7681">EY Academy of Business  /  Eurasia</text>
  </g>

  <!-- right: terminal -->
  <g class="float">
    <rect x="440" y="40" width="420" height="240" rx="10" fill="#0b0f17" stroke="#30363d"/>
    <path d="M440 50a10 10 0 0 1 10-10h400a10 10 0 0 1 10 10v22H440z" fill="#161b22"/>
    <circle cx="460" cy="56" r="5" fill="#ff5f56"/>
    <circle cx="478" cy="56" r="5" fill="#ffbd2e"/>
    <circle cx="496" cy="56" r="5" fill="#27c93f"/>
    <text x="650" y="60" class="mono" font-size="11" fill="#6e7681" text-anchor="middle">lead_scoring.py</text>

    <g class="mono" font-size="13">
      <g class="row r0"><text x="462" y="102" fill="#6e7681">$ </text><text x="476" y="102" fill="#e6edf3">python score_leads.py --queue</text></g>

      <g class="row r1">
        <text x="462" y="140" fill="#9da7b3">lead_0412</text>
        <rect x="548" y="129" width="150" height="11" rx="3" fill="#ffffff" fill-opacity="0.06"/>
        <rect class="bar b1" x="548" y="129" width="137" height="11" rx="3" fill="#f85149"/>
        <text x="708" y="140" fill="#e6edf3">0.91</text>
        <text x="750" y="140" fill="#f85149" font-weight="700">HOT</text>
      </g>
      <g class="row r2">
        <text x="462" y="172" fill="#9da7b3">lead_0413</text>
        <rect x="548" y="161" width="150" height="11" rx="3" fill="#ffffff" fill-opacity="0.06"/>
        <rect class="bar b2" x="548" y="161" width="87" height="11" rx="3" fill="#A177F7"/>
        <text x="708" y="172" fill="#e6edf3">0.58</text>
        <text x="750" y="172" fill="#A177F7" font-weight="700">STD</text>
      </g>
      <g class="row r3">
        <text x="462" y="204" fill="#9da7b3">lead_0414</text>
        <rect x="548" y="193" width="150" height="11" rx="3" fill="#ffffff" fill-opacity="0.06"/>
        <rect class="bar b3" x="548" y="193" width="35" height="11" rx="3" fill="#38BDF8"/>
        <text x="708" y="204" fill="#e6edf3">0.23</text>
        <text x="750" y="204" fill="#38BDF8" font-weight="700">NURT</text>
      </g>

      <g class="row r4">
        <text x="462" y="240" fill="#3fb950">&#10003; HOT   -> call within 15 min</text>
        <text x="462" y="260" fill="#6e7681">$ </text><rect class="cursor" x="476" y="249" width="8" height="14" fill="#A177F7"/>
      </g>
    </g>
  </g>

  <!-- decorative pulses -->
  <circle class="pulse" cx="868" cy="28" r="3" fill="#38BDF8"/>
  <circle class="pulse" cx="880" cy="42" r="2" fill="#A177F7" style="animation-delay:.7s"/>
</svg>
