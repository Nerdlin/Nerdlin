<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="Marketing, Data, Product, Automation">
  <defs>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}
      .card{opacity:0;animation:in .6s ease forwards}
      .c1{animation-delay:.1s}.c2{animation-delay:.25s}.c3{animation-delay:.4s}.c4{animation-delay:.55s}
      @keyframes in{to{opacity:1}}
    </style>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0f1320"/>
    </linearGradient>
  </defs>

  <g class="card c1">
    <rect x="0.5" y="0.5" width="208" height="189" rx="12" fill="url(#card)" stroke="#A177F7" stroke-opacity="0.45"/>
    <rect x="0.5" y="0.5" width="208" height="4" rx="2" fill="#A177F7"/>
    <rect x="22" y="26" width="44" height="44" rx="10" fill="#A177F7" fill-opacity="0.14"/>
    <path d="M33 37H55L47.5 47V60L41 56V47Z" fill="#A177F7"/>
    <text x="22" y="100" class="sans" font-size="17" font-weight="700" fill="#e6edf3">Marketing</text>
    <text x="22" y="126" class="sans" font-size="13" fill="#9da7b3">Analytics, reporting,</text>
    <text x="22" y="146" class="sans" font-size="13" fill="#9da7b3">lead funnels, events</text>
    <text x="22" y="174" class="mono" font-size="11" fill="#A177F7">EY Academy</text>
  </g>

  <g class="card c2" transform="translate(230 0)">
    <rect x="0.5" y="0.5" width="208" height="189" rx="12" fill="url(#card)" stroke="#38BDF8" stroke-opacity="0.45"/>
    <rect x="0.5" y="0.5" width="208" height="4" rx="2" fill="#38BDF8"/>
    <rect x="22" y="26" width="44" height="44" rx="10" fill="#38BDF8" fill-opacity="0.14"/>
    <path d="M32 58L40 48L47 52L57 38" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="57" cy="38" r="3" fill="#38BDF8"/>
    <text x="22" y="100" class="sans" font-size="17" font-weight="700" fill="#e6edf3">Data</text>
    <text x="22" y="126" class="sans" font-size="13" fill="#9da7b3">Python, ML scoring,</text>
    <text x="22" y="146" class="sans" font-size="13" fill="#9da7b3">Explainable AI, Streamlit</text>
    <text x="22" y="174" class="mono" font-size="11" fill="#38BDF8">pandas / sklearn</text>
  </g>

  <g class="card c3" transform="translate(460 0)">
    <rect x="0.5" y="0.5" width="208" height="189" rx="12" fill="url(#card)" stroke="#3fb950" stroke-opacity="0.45"/>
    <rect x="0.5" y="0.5" width="208" height="4" rx="2" fill="#3fb950"/>
    <rect x="22" y="26" width="44" height="44" rx="10" fill="#3fb950" fill-opacity="0.14"/>
    <text x="44" y="55" class="mono" font-size="16" font-weight="700" fill="#3fb950" text-anchor="middle">&lt;/&gt;</text>
    <text x="22" y="100" class="sans" font-size="17" font-weight="700" fill="#e6edf3">Product</text>
    <text x="22" y="126" class="sans" font-size="13" fill="#9da7b3">React / Next.js / TypeScript,</text>
    <text x="22" y="146" class="sans" font-size="13" fill="#9da7b3">Django &amp; FastAPI</text>
    <text x="22" y="174" class="mono" font-size="11" fill="#3fb950">web apps</text>
  </g>

  <g class="card c4" transform="translate(690 0)">
    <rect x="0.5" y="0.5" width="208" height="189" rx="12" fill="url(#card)" stroke="#f0883e" stroke-opacity="0.45"/>
    <rect x="0.5" y="0.5" width="208" height="4" rx="2" fill="#f0883e"/>
    <rect x="22" y="26" width="44" height="44" rx="10" fill="#f0883e" fill-opacity="0.14"/>
    <path d="M47 35L35 50H43L40 62L53 46H45Z" fill="#f0883e"/>
    <text x="22" y="100" class="sans" font-size="17" font-weight="700" fill="#e6edf3">Automation</text>
    <text x="22" y="126" class="sans" font-size="13" fill="#9da7b3">Telegram &amp; Discord bots,</text>
    <text x="22" y="146" class="sans" font-size="13" fill="#9da7b3">GPT assistants, CRM flows</text>
    <text x="22" y="174" class="mono" font-size="11" fill="#f0883e">less manual work</text>
  </g>
</svg>
