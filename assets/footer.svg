<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="100" viewBox="0 0 900 100" preserveAspectRatio="none" role="img" aria-label="">
  <defs>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a1140"/><stop offset="0.5" stop-color="#2d1a72"/><stop offset="1" stop-color="#1a1140"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A177F7"/><stop offset="0.5" stop-color="#38BDF8"/><stop offset="1" stop-color="#A177F7"/></linearGradient>
    <clipPath id="clip"><rect width="900" height="100"/></clipPath>
    <path id="wave" d="M0 45C150 5 300 85 450 45C600 5 750 85 900 45V100H0Z"/>
    <path id="line" d="M0 45C150 5 300 85 450 45C600 5 750 85 900 45" fill="none"/>
    <style>
      .back{animation:slide 18s linear infinite}
      .front{animation:slide 11s linear infinite}
      @keyframes slide{to{transform:translateX(-900px)}}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <g transform="translate(0 14)" opacity="0.45">
      <g class="back">
        <use xlink:href="#wave" fill="url(#w1)"/>
        <use xlink:href="#wave" x="900" fill="url(#w1)"/>
      </g>
    </g>
    <g class="front">
      <use xlink:href="#wave" fill="url(#w1)"/>
      <use xlink:href="#wave" x="900" fill="url(#w1)"/>
      <use xlink:href="#line" stroke="url(#edge)" stroke-width="1.5" stroke-opacity="0.7"/>
      <use xlink:href="#line" x="900" stroke="url(#edge)" stroke-width="1.5" stroke-opacity="0.7"/>
    </g>
  </g>
</svg>
