<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-label="Acquire, Measure, Automate, Decide">
  <defs>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="112" y1="0" x2="787" y2="0">
      <stop offset="0" stop-color="#A177F7"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}
      .flow{stroke-dasharray:6 8;animation:dash 1.2s linear infinite}
      .step{opacity:0;animation:in .6s ease forwards}
      .s1{animation-delay:.1s}.s2{animation-delay:.3s}.s3{animation-delay:.5s}.s4{animation-delay:.7s}
      @keyframes dash{to{stroke-dashoffset:-14}}
      @keyframes in{to{opacity:1}}
    </style>
  </defs>

  <line class="flow" x1="112" y1="32" x2="787" y2="32" stroke="url(#line)" stroke-width="2" stroke-opacity="0.8"/>

  <g class="step s1">
    <circle cx="112" cy="32" r="22" fill="#0d1117" stroke="#A177F7" stroke-width="2"/>
    <text x="112" y="38" class="mono" font-size="16" font-weight="700" fill="#A177F7" text-anchor="middle">01</text>
    <text x="112" y="88" class="sans" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Acquire</text>
    <text x="112" y="110" class="sans" font-size="13" fill="#9da7b3" text-anchor="middle">Campaigns, events,</text>
    <text x="112" y="128" class="sans" font-size="13" fill="#9da7b3" text-anchor="middle">landing pages</text>
  </g>
  <g class="step s2">
    <circle cx="337" cy="32" r="22" fill="#0d1117" stroke="#7f9cf7" stroke-width="2"/>
    <text x="337" y="38" class="mono" font-size="16" font-weight="700" fill="#7f9cf7" text-anchor="middle">02</text>
    <text x="337" y="88" class="sans" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Measure</text>
    <text x="337" y="110" class="sans" font-size="13" fill="#9da7b3" text-anchor="middle">Funnels, cohorts,</text>
    <text x="337" y="128" class="sans" font-size="13" fill="#9da7b3" text-anchor="middle">attribution</text>
  </g>
  <g class="step s3">
    <circle cx="562" cy="32" r="22" fill="#0d1117" stroke="#38BDF8" stroke-width="2"/>
    <text x="562" y="38" class="mono" font-size="16" font-weight="700" fill="#38BDF8" text-anchor="middle">03</text>
    <text x="562" y="88" class="sans" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Automate</text>
    <text x="562" y="110" class="sans" font-size="13" fill="#9da7b3" text-anchor="middle">Bots, CRM flows,</text>
    <text x="562" y="128" class="sans" font-size="13" fill="#9da7b3" text-anchor="middle">reminders</text>
  </g>
  <g class="step s4">
    <circle cx="787" cy="32" r="22" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <text x="787" y="38" class="mono" font-size="16" font-weight="700" fill="#3fb950" text-anchor="middle">04</text>
    <text x="787" y="88" class="sans" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">Decide</text>
    <text x="787" y="110" class="sans" font-size="13" fill="#9da7b3" text-anchor="middle">Scoring, dashboards,</text>
    <text x="787" y="128" class="sans" font-size="13" fill="#9da7b3" text-anchor="middle">explainable AI</text>
  </g>
</svg>
